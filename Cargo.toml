[workspace]
resolver = "2"
members = [
    "crates/crosspond-app",
    "crates/crosspond-chrome-host",
    "crates/crosspond-core",
    "crates/crosspond-knowledge",
    "crates/crosspond-macos",
    "crates/crosspond-model",
    "crates/crosspond-tools",
]
default-members = ["crates/crosspond-app", "crates/crosspond-chrome-host"]

[workspace.package]
version = "0.0.1" # x-release-please-version
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
crosspond-chrome-host = { path = "crates/crosspond-chrome-host" }
crosspond-core = { path = "crates/crosspond-core" }
crosspond-knowledge = { path = "crates/crosspond-knowledge" }
crosspond-macos = { path = "crates/crosspond-macos" }
crosspond-model = { path = "crates/crosspond-model" }
crosspond-tools = { path = "crates/crosspond-tools" }

# Remaining direct crates are pinned after the first successful lockfile.
base64 = "=0.22.1"
digest_auth = "=0.3.1"
global-hotkey = "=0.8.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "=2.0.20"
uuid = { version = "=1.24.0", features = ["v4", "v7", "serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
tauri-build = "=2.6.3"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
time = { version = "=0.3.47", default-features = false, features = ["std", "formatting"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
notify = "=8.2.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false }
objc2-app-kit = { version = "=0.3.2", default-features = false }
objc2-event-kit = { version = "=0.3.2", default-features = false }
objc2-quartz-core = { version = "=0.3.2", default-features = false }
block2 = "=0.6.2"
core-foundation = "=0.10.0"
libc = "=0.2.189"

