[package]
name = "crosspond-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crosspond-core.workspace = true
crosspond-tools.workspace = true
serde.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey.workspace = true
security-framework.workspace = true
security-framework-sys.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSDate",
    "NSError",
    "NSFormatter",
    "NSISO8601DateFormatter",
    "NSPredicate",
    "NSString",
] }
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSColor",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "NSRunningApplication",
    "libc",
] }
objc2-event-kit = { workspace = true, features = [
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKTypes",
    "block2",
] }
block2.workspace = true
core-foundation.workspace = true
libc.workspace = true
base64.workspace = true
serde_json.workspace = true
