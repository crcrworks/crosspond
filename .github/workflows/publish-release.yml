name: Publish Release

# Manual only, from main. Non-admins fail the admin gate. Apple / updater
# secrets are only available on the `bundle` job (`environment: release`).
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: publish-release-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release-metadata.outputs.tag_name }}
      version: ${{ steps.release-metadata.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require admin on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-repo-admin.sh

      - name: Read release metadata
        id: release-metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { appendFile } from "node:fs/promises";
          import { assertExactSemver } from "./.github/scripts/github.mjs";

          const manifest = JSON.parse(readFileSync(".release-please-manifest.json", "utf8"));
          const tauriConf = JSON.parse(readFileSync("crates/crosspond-app/tauri.conf.json", "utf8"));
          const packageJson = JSON.parse(readFileSync("ui/package.json", "utf8"));
          const cargo = readFileSync("Cargo.toml", "utf8");
          const cargoMatch = cargo.match(
            /\[workspace\.package\][\s\S]*?^version = "([0-9]+\.[0-9]+\.[0-9]+)"/m,
          );
          const cargoVersion = cargoMatch?.[1];
          const version = manifest["."];
          assertExactSemver(version, ".release-please-manifest.json");
          if (tauriConf.version !== version) {
            throw new Error(`tauri.conf.json version ${tauriConf.version} does not match ${version}.`);
          }
          if (packageJson.version !== version) {
            throw new Error(`ui/package.json version ${packageJson.version} does not match ${version}.`);
          }
          if (cargoVersion !== version) {
            throw new Error(`Cargo.toml workspace version ${cargoVersion} does not match ${version}.`);
          }

          const outputPath = process.env.GITHUB_OUTPUT;
          if (!outputPath) {
            throw new Error("GITHUB_OUTPUT is not set.");
          }
          await appendFile(outputPath, `version=${version}\ntag_name=v${version}\n`);
          NODE

      - name: Validate release metadata commit is current main
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          release_metadata_sha="$(
            git log -1 --format=%H -- \
              Cargo.toml \
              ui/package.json \
              crates/crosspond-app/tauri.conf.json \
              .release-please-manifest.json
          )"
          if [[ "$release_metadata_sha" != "$head_sha" ]]; then
            {
              echo "main contains commits after the release metadata commit."
              echo "Prepare Release PR を次バージョンで作り直し、最新の main を含めてから Publish を再実行してください。"
            } >&2
            exit 1
          fi

      - name: Validate release is unpublished or a leftover draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          TAG_NAME: ${{ steps.release-metadata.outputs.tag_name }}
          VERSION: ${{ steps.release-metadata.outputs.version }}
        run: bash .github/scripts/assert-can-publish.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy portable crates
        run: cargo clippy -p crosspond-core -p crosspond-model -p crosspond-tools -p crosspond-knowledge -p crosspond-chrome-host --all-targets -- -D warnings

      - name: Test portable crates
        run: cargo test -p crosspond-core -p crosspond-model -p crosspond-tools -p crosspond-knowledge -p crosspond-chrome-host

      - name: Release script tests
        run: node --test .github/scripts/*.test.mjs

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Check UI
        working-directory: ui
        run: npm run check

      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Confirm tested release commit is still current
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          git fetch origin main
          current_main_sha="$(git rev-parse origin/main)"
          if [[ "$current_main_sha" != "$tested_sha" ]]; then
            echo "main changed after this job checked out the release commit. Re-run Publish Release." >&2
            exit 1
          fi

  draft_release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      tag_name: ${{ steps.release-id.outputs.tag_name }}
      release_id: ${{ steps.release-id.outputs.release_id }}
      version: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm tested release commit is still current
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          git fetch origin main
          current_main_sha="$(git rev-parse origin/main)"
          if [[ "$current_main_sha" != "$tested_sha" ]]; then
            echo "main changed after validate. Re-run Publish Release." >&2
            exit 1
          fi

      - name: Require admin on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-repo-admin.sh

      - name: Reuse leftover draft if present
        id: existing
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
        run: |
          set -euo pipefail
          if draft_json="$(gh release view "$TAG_NAME" --json id,isDraft 2>/dev/null)"; then
            is_draft="$(printf '%s' "$draft_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("isDraft") is True)')"
            release_id="$(printf '%s' "$draft_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
            if [[ "$is_draft" != "True" ]]; then
              echo "GitHub Release ${TAG_NAME} is already public." >&2
              exit 1
            fi
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Release Please
        if: ${{ steps.existing.outputs.reuse != 'true' }}
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ needs.validate.outputs.version }}
          skip-github-pull-request: true
          target-branch: main

      - name: Record draft release id
        id: release-id
        env:
          EXPECTED_TAG: ${{ needs.validate.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          REUSE: ${{ steps.existing.outputs.reuse }}
          REUSE_ID: ${{ steps.existing.outputs.release_id }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "${REUSE}" == "true" ]]; then
            tag="$EXPECTED_TAG"
            release_id="$REUSE_ID"
          else
            if [[ "${RELEASE_CREATED}" != "true" ]]; then
              echo "Release Please did not create a release (release_created=${RELEASE_CREATED})." >&2
              exit 1
            fi
            if [[ "${TAG_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "Expected ${EXPECTED_TAG}, but Release Please created ${TAG_NAME}." >&2
              exit 1
            fi
            tag="$TAG_NAME"
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            tested_sha="$(git rev-parse HEAD)"
            tag_sha="$(git rev-list -n 1 "${tag}")"
            if [[ "${tag_sha}" != "${tested_sha}" ]]; then
              echo "Release tag ${tag} points to ${tag_sha}, but CI tested ${tested_sha}." >&2
              exit 1
            fi
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)"
          fi

          draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq .draft)"
          if [[ "${draft}" != "true" ]]; then
            echo "GitHub Release ${tag} must stay draft until artifacts are verified." >&2
            exit 1
          fi
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Use public changelog as release notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
        run: |
          set -euo pipefail
          node .github/scripts/extract-public-release-notes.mjs > /tmp/release-notes.md
          gh release edit "$TAG_NAME" --notes-file /tmp/release-notes.md --draft

  bundle:
    name: Sign, notarize, and upload macOS app
    needs: draft_release
    if: ${{ needs.draft_release.outputs.release_id != '' }}
    runs-on: macos-latest
    environment: release
    outputs:
      tag_name: ${{ needs.draft_release.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.draft_release.outputs.tag_name }}

      - name: Require admin on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-repo-admin.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Require Apple signing, notarization, and updater key
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash .github/scripts/require-apple-signing.sh

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "${APPLE_API_KEY_P8}" ]]; then
            printf '%s\n' "${APPLE_API_KEY_P8}" > "${RUNNER_TEMP}/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=${RUNNER_TEMP}/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          projectPath: crates/crosspond-app
          tauriScript: npm --prefix ${{ github.workspace }}/ui exec -- tauri
          args: --target aarch64-apple-darwin
          releaseId: ${{ needs.draft_release.outputs.release_id }}
          includeUpdaterJson: true

      - name: Verify signature, notarization, and draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/verify-macos-release.sh ${{ needs.draft_release.outputs.tag_name }} aarch64-apple-darwin

  publish:
    name: Publish GitHub Release
    needs:
      - bundle
      - draft_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require admin on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-repo-admin.sh

      - name: Publish draft after verified artifacts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          TAG_NAME: ${{ needs.draft_release.outputs.tag_name }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)"
          if [[ "$draft" != "true" ]]; then
            echo "Expected ${TAG_NAME} to still be a draft before publishing." >&2
            exit 1
          fi
          gh release edit "$TAG_NAME" --draft=false
          published="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)"
          if [[ "$published" != "false" ]]; then
            echo "Failed to publish GitHub Release ${TAG_NAME}." >&2
            exit 1
          fi
          echo "Published ${TAG_NAME}. latest.json is now at /releases/latest/download/latest.json"
