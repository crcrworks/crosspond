name: CI

# Fail-fast format, then compile/test. Graph:
#
#   rust-format ──┬── rust-check        (portable clippy + nextest)
#                 └── macos-security    (Seatbelt; special sandbox)
#   frontend-check                      (parallel; no UI formatter)
#   audit / gitleaks                    (parallel; no Rust compile)
#
# Format failure skips rust-check and macos-security. No PR Tauri bundle.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all --check

  rust-check:
    name: Rust clippy and test
    needs: [rust-format]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: cargo clippy (portable crates)
        run: >
          cargo clippy
          -p crosspond-core
          -p crosspond-model
          -p crosspond-tools
          -p crosspond-knowledge
          -p crosspond-chrome-host
          --all-targets
          --locked
          -- -D warnings

      - name: cargo nextest (portable crates)
        run: >
          cargo nextest run
          -p crosspond-core
          -p crosspond-model
          -p crosspond-tools
          -p crosspond-knowledge
          -p crosspond-chrome-host
          --all-targets
          --locked

  macos-security:
    name: macOS Seatbelt
    needs: [rust-format]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test (Seatbelt)
        run: cargo test -p crosspond-macos --all-targets --locked -- --test-threads=1

  frontend-check:
    name: UI check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: check
        run: npm run check

      - name: test
        run: npm test

      - name: build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm audit
        working-directory: ui
        run: npm ci && npm audit --audit-level=high

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
